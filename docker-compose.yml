services:
  teatro:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${TEATRO_IMAGE:-teatro:local}"
    restart: unless-stopped
    environment:
      TEATRO_BIND_ADDR: "${TEATRO_BIND_ADDR:-0.0.0.0:4440}"
      TEATRO_DATABASE_URL: "${TEATRO_DATABASE_URL:-sqlite:///data/teatro.sqlite3}"
      TEATRO_DATA_DIR: "${TEATRO_DATA_DIR:-/data}"
      TEATRO_DEFAULT_LIBRARY_ROOT: "${TEATRO_DEFAULT_LIBRARY_ROOT:-/data/roms}"
      TEATRO_ASSET_ROOT: "${TEATRO_ASSET_ROOT:-/data/assets}"
      TEATRO_LAN_DISCOVERY_ENABLED: "${TEATRO_LAN_DISCOVERY_ENABLED:-false}"
      TEATRO_DISCOVERY_NAME: "${TEATRO_DISCOVERY_NAME:-Teatro}"
      TEATRO_MAX_UPLOAD_BYTES: "${TEATRO_MAX_UPLOAD_BYTES:-137438953472}"
      TEATRO_MAX_UPLOAD_BATCH_FILES: "${TEATRO_MAX_UPLOAD_BATCH_FILES:-256}"
      TEATRO_MAX_UPLOAD_BATCH_BYTES: "${TEATRO_MAX_UPLOAD_BATCH_BYTES:-137438953472}"
      TEATRO_MAX_CONCURRENT_UPLOADS: "${TEATRO_MAX_CONCURRENT_UPLOADS:-2}"
      TEATRO_MAX_MULTIPART_TEXT_BYTES: "${TEATRO_MAX_MULTIPART_TEXT_BYTES:-4096}"
      TEATRO_UPLOAD_FREE_SPACE_MARGIN_BYTES: "${TEATRO_UPLOAD_FREE_SPACE_MARGIN_BYTES:-536870912}"
      TEATRO_UPLOAD_DISK_CHECK_INTERVAL_BYTES: "${TEATRO_UPLOAD_DISK_CHECK_INTERVAL_BYTES:-67108864}"
      TEATRO_STALE_UPLOAD_AGE_SECONDS: "${TEATRO_STALE_UPLOAD_AGE_SECONDS:-86400}"
      TEATRO_MAX_DOWNLOAD_ARCHIVE_FILES: "${TEATRO_MAX_DOWNLOAD_ARCHIVE_FILES:-256}"
      TEATRO_MAX_DOWNLOAD_ARCHIVE_BYTES: "${TEATRO_MAX_DOWNLOAD_ARCHIVE_BYTES:-53687091200}"
      TEATRO_MAX_CONCURRENT_DOWNLOAD_ARCHIVES: "${TEATRO_MAX_CONCURRENT_DOWNLOAD_ARCHIVES:-1}"
      TEATRO_DOWNLOAD_ARCHIVE_FREE_SPACE_MARGIN_BYTES: "${TEATRO_DOWNLOAD_ARCHIVE_FREE_SPACE_MARGIN_BYTES:-536870912}"
      TEATRO_GOG_IMPORT_ENABLED: "${TEATRO_GOG_IMPORT_ENABLED:-false}"
      TEATRO_INNOEXTRACT_PATH:
      TEATRO_INNOEXTRACT_SHA256:
      TEATRO_GOG_IMPORT_HELPER_PATH:
      TEATRO_GOG_IMPORT_TIMEOUT_SECONDS: "${TEATRO_GOG_IMPORT_TIMEOUT_SECONDS:-1800}"
      TEATRO_GOG_IMPORT_MAX_EXTRACTED_BYTES: "${TEATRO_GOG_IMPORT_MAX_EXTRACTED_BYTES:-53687091200}"
      TEATRO_GOG_IMPORT_MAX_EXTRACTED_FILES: "${TEATRO_GOG_IMPORT_MAX_EXTRACTED_FILES:-20000}"
      TEATRO_ROMM_SOURCE_ENABLED: "${TEATRO_ROMM_SOURCE_ENABLED:-false}"
      TEATRO_ROMM_SOURCE_TIMEOUT_SECONDS: "${TEATRO_ROMM_SOURCE_TIMEOUT_SECONDS:-30}"
      TEATRO_ROMM_IMPORT_TIMEOUT_SECONDS: "${TEATRO_ROMM_IMPORT_TIMEOUT_SECONDS:-3600}"
      TEATRO_ROMM_IMPORT_MAX_BYTES:
      TEATRO_ROMM_IMPORT_MAX_FILES: "${TEATRO_ROMM_IMPORT_MAX_FILES:-64}"
      TEATRO_LOG_FORMAT: "${TEATRO_LOG_FORMAT:-json}"
      TEATRO_AUTH_RATE_LIMIT_MAX_FAILURES: "${TEATRO_AUTH_RATE_LIMIT_MAX_FAILURES:-10}"
      TEATRO_AUTH_RATE_LIMIT_WINDOW_SECONDS: "${TEATRO_AUTH_RATE_LIMIT_WINDOW_SECONDS:-300}"
      TEATRO_AUTH_RATE_LIMIT_LOCKOUT_SECONDS: "${TEATRO_AUTH_RATE_LIMIT_LOCKOUT_SECONDS:-60}"
      TEATRO_AUTH_RATE_LIMIT_MAX_ENTRIES: "${TEATRO_AUTH_RATE_LIMIT_MAX_ENTRIES:-10000}"
      TEATRO_PASSWORD_CONCURRENCY: "${TEATRO_PASSWORD_CONCURRENCY:-2}"
      TEATRO_PASSWORD_QUEUE_DEPTH: "${TEATRO_PASSWORD_QUEUE_DEPTH:-16}"
      TEATRO_PASSWORD_QUEUE_TIMEOUT_SECONDS: "${TEATRO_PASSWORD_QUEUE_TIMEOUT_SECONDS:-5}"
      TEATRO_MAX_USERNAME_BYTES: "${TEATRO_MAX_USERNAME_BYTES:-128}"
      TEATRO_MAX_PASSWORD_BYTES: "${TEATRO_MAX_PASSWORD_BYTES:-1024}"
      TEATRO_TOKEN_TOUCH_INTERVAL_SECONDS: "${TEATRO_TOKEN_TOUCH_INTERVAL_SECONDS:-300}"
      TEATRO_TRUSTED_PROXY_IPS:
      TEATRO_IGDB_CLIENT_ID:
      TEATRO_IGDB_CLIENT_SECRET:
      TEATRO_ADMIN_PASSWORD:
      TEATRO_USER_PASSWORD:
      RUST_LOG: "${RUST_LOG:-teatro=info,tower_http=info}"
    ports:
      - "${TEATRO_HOST_PORT:-4440}:4440"
    volumes:
      - teatro-data:/data

volumes:
  teatro-data:
    name: "${TEATRO_DATA_VOLUME:-teatro-data}"
