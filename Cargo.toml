[package]
name = "teatro"
version = "0.19.7"
edition = "2024"
rust-version = "1.88"
description = "Teatro self-hosted game library server"
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/lodilorenzo/teatro"

[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
axum = { version = "0.8.4", features = ["multipart"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.53", features = ["derive", "env"] }
crc32fast = "1.5.0"
fs2 = "0.4.3"
md-5 = "0.10.6"
mdns-sd = { version = "=0.20.2", default-features = false, features = ["async"] }
quick-xml = { version = "0.41.0", features = ["serialize"] }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls", "stream"] }
rpassword = "7.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha1 = "0.10.6"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "net", "sync", "time"] }
tokio-util = { version = "0.7.17", features = ["io"] }
tower-http = { version = "0.6.6", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
unicode-normalization = "0.1.25"
url = "2.5.8"
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", default-features = false, features = ["signal", "fs"] }

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
