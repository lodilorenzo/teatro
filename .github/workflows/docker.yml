name: Beta Docker images

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full owner-reviewed commit SHA on main
        required: true
        type: string
      publish:
        description: Publish the tested images after owner approval
        default: false
        type: boolean

permissions:
  contents: read
  checks: read

concurrency:
  group: beta-docker-publication
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'lodilorenzo/teatro' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            trivy_arch: 64bit
            trivy_sha: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          - arch: arm64
            runner: ubuntu-24.04-arm
            trivy_arch: ARM64
            trivy_sha: b94ce1976bbf3c15b514b605ee88be7c6d94a29be2302847ff01cb794d47aad5
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      EXPECTED_SHA: ${{ inputs.source_sha }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Require reviewed SHA and passing source CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          test -z "$(git status --porcelain)"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" > "$RUNNER_TEMP/checks.json"
          python3 - "$RUNNER_TEMP/checks.json" <<'PY'
          import json, sys
          checks = json.load(open(sys.argv[1]))['check_runs']
          for name in ('rust', 'msrv', 'browser', 'shell-and-audit', 'docker'):
              matches = [c for c in checks if c['name'] == name and c['app']['id'] == 15368]
              assert matches and max(matches, key=lambda c: c['id'])['conclusion'] == 'success', name
          PY
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          buildkitd-flags: --debug
      - name: Install checksum-pinned image scanner
        env:
          TRIVY_ARCH: ${{ matrix.trivy_arch }}
          TRIVY_SHA: ${{ matrix.trivy_sha }}
        run: |
          mkdir "$RUNNER_TEMP/trivy"
          cd "$RUNNER_TEMP/trivy"
          curl --fail --location --proto '=https' "https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-$TRIVY_ARCH.tar.gz" -o trivy.tar.gz
          printf '%s  trivy.tar.gz\n' "$TRIVY_SHA" | sha256sum --check --strict
          tar -xzf trivy.tar.gz trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
      - name: Build, test, scan and export the same native image
        run: |
          VERSION=$(python3 -c 'import re,tomllib; v=tomllib.load(open("Cargo.toml","rb"))["package"]["version"]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",v); print(v)')
          EPOCH=$(git show -s --format=%ct HEAD)
          mkdir "$RUNNER_TEMP/image"
          COMMON=(--platform "linux/$ARCH" --build-arg "SOURCE_DATE_EPOCH=$EPOCH"
            --label "org.opencontainers.image.revision=$GITHUB_SHA"
            --label "org.opencontainers.image.version=$VERSION" --tag teatro:test)
          docker buildx build "${COMMON[@]}" --provenance=false --load .
          [[ "$(docker run --rm --network none teatro:test --version)" == "teatro $VERSION" ]]
          scripts/test-docker-image.sh teatro:test
          python3 packaging/test-verify-oci.py
          docker image inspect teatro:test > "$RUNNER_TEMP/image/inspection.json"
          trivy image --image-src docker --scanners vuln --format json --output "$RUNNER_TEMP/image/scan.json" teatro:test
          python3 packaging/test-image-security.py "$RUNNER_TEMP/image/scan.json"
          python3 packaging/check-image-security.py "$RUNNER_TEMP/image/scan.json"
          docker buildx build "${COMMON[@]}" --provenance=mode=max \
            --attest type=sbom,generator=docker/buildkit-syft-scanner@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9 \
            --output "type=oci,dest=$RUNNER_TEMP/image/image.tar" .
          python3 packaging/verify-oci.py "$RUNNER_TEMP/image/image.tar" "$ARCH" \
            "$RUNNER_TEMP/image/inspection.json" > "$RUNNER_TEMP/image/digest.txt"
      - name: Retain unfiltered scan evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-${{ matrix.arch }}
          path: ${{ runner.temp }}/image/scan.json
          if-no-files-found: warn
          retention-days: 30
      - name: Retain verified OCI image for promotion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: build
    if: inputs.publish && github.repository == 'lodilorenzo/teatro' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/lodilorenzo/teatro
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          digest-mismatch: error
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Install OCI transport
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends skopeo
      - name: Refuse changed main or an existing version tag
        run: |
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$GITHUB_SHA" ]]
          python3 - <<'PY'
          import base64, datetime, json, os, re, tomllib, urllib.error, urllib.parse, urllib.request
          now = datetime.datetime.now(datetime.timezone.utc)
          rules = json.load(open('packaging/trivy-ignore.yaml'))['vulnerabilities']
          assert all(now < datetime.datetime.fromisoformat(rule['expired_at']) for rule in rules), 'Security review expired'
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version)
          credentials = base64.b64encode(f'{os.environ["GITHUB_ACTOR"]}:{os.environ["GH_TOKEN"]}'.encode()).decode()
          query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': 'repository:lodilorenzo/teatro:pull,push'})
          request = urllib.request.Request('https://ghcr.io/token?' + query, headers={'Authorization': 'Basic ' + credentials})
          token = json.load(urllib.request.urlopen(request, timeout=30))['token']
          request = urllib.request.Request(f'https://ghcr.io/v2/lodilorenzo/teatro/manifests/{version}', method='HEAD',
              headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json'})
          try:
              urllib.request.urlopen(request, timeout=30).close()
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              raise SystemExit('Version tag already exists; never overwrite a published image')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'VERSION={version}\n')
          PY
      - name: Promote verified blobs without rebuilding, then sign digests
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          DIGESTS=()
          for arch in amd64 arm64; do
            dir="$RUNNER_TEMP/images/image-$arch"
            digest=$(python3 packaging/verify-oci.py "$dir/image.tar" "$arch" "$dir/inspection.json")
            [[ "$digest" == "$(< "$dir/digest.txt")" ]]
            skopeo copy --all --preserve-digests "oci-archive:$dir/image.tar" "docker://$IMAGE@$digest"
            DIGESTS+=("$IMAGE@$digest")
          done
          docker buildx imagetools create --dry-run "${DIGESTS[@]}" > "$RUNNER_TEMP/index.json"
          python3 - "$RUNNER_TEMP/index.json" <<'PY'
          import base64, hashlib, json, os, pathlib, sys, urllib.parse, urllib.request
          data = pathlib.Path(sys.argv[1]).read_bytes()
          index = json.loads(data)
          platforms = [(m['platform']['os'], m['platform']['architecture']) for m in index['manifests'] if m['platform']['os'] != 'unknown']
          assert sorted(platforms) == [('linux', 'amd64'), ('linux', 'arm64')], platforms
          digest = 'sha256:' + hashlib.sha256(data).hexdigest()
          credentials = base64.b64encode(f'{os.environ["GITHUB_ACTOR"]}:{os.environ["GH_TOKEN"]}'.encode()).decode()
          query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': 'repository:lodilorenzo/teatro:pull,push'})
          request = urllib.request.Request('https://ghcr.io/token?' + query, headers={'Authorization': 'Basic ' + credentials})
          token = json.load(urllib.request.urlopen(request, timeout=30))['token']
          request = urllib.request.Request('https://ghcr.io/v2/lodilorenzo/teatro/manifests/' + digest,
              data=data, method='PUT', headers={'Authorization': 'Bearer ' + token, 'Content-Type': index['mediaType']})
          with urllib.request.urlopen(request, timeout=60) as response:
              assert response.status == 201 and response.headers['Docker-Content-Digest'] == digest
          pathlib.Path(os.environ['RUNNER_TEMP'], 'index-digest.txt').write_text(digest)
          PY
          INDEX=$(< "$RUNNER_TEMP/index-digest.txt")
          # The index signature covers both platform manifests and their attestations.
          for ref in "$IMAGE@$INDEX" "${DIGESTS[@]}"; do
            cosign sign --yes "$ref"
            cosign verify "$ref" \
              --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/docker.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
          # Expose the version tag only after the already-uploaded digests verify.
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$INDEX"
          [[ "$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')" == "$INDEX" ]]
          printf 'Beta image: %s:%s\n\nIndex: %s@%s\n\nSource: %s\n\nVerify package visibility and anonymous pulls before announcing publication.\n' \
            "$IMAGE" "$VERSION" "$IMAGE" "$INDEX" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove registry login
        if: always()
        run: docker logout ghcr.io
